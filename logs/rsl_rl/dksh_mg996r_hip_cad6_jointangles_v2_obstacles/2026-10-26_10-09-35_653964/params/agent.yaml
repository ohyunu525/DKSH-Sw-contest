seed: 42
device: cuda:0
num_steps_per_env: 128
max_iterations: 27250
empirical_normalization: true
policy:
  class_name: ActorCritic
  init_noise_std: 0.08
  noise_std_type: scalar
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.001
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.00015
  schedule: adaptive
  gamma: 0.9995
  lam: 0.98
  desired_kl: 0.008
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
clip_actions: null
save_interval: 50
experiment_name: dksh_mg996r_hip_cad6_jointangles_v2_obstacles
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
