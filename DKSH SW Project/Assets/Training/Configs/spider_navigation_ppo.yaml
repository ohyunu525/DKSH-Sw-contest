behaviors:
  SpiderNavigation:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 50000

environment_parameters:
  map_level:
    curriculum:
      - name: Flat
        completion_criteria:
          measure: reward
          behavior: SpiderNavigation
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
          require_reset: true
        value: 1.0
      - name: Stairs
        completion_criteria:
          measure: reward
          behavior: SpiderNavigation
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
          require_reset: true
        value: 2.0
      - name: Hills
        completion_criteria:
          measure: reward
          behavior: SpiderNavigation
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.8
          require_reset: true
        value: 3.0
      - name: Buildings
        value: 4.0
