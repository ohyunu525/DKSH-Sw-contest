services:
  ros2:
    devices:
      - "${UNITREE_LIDAR_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    command:
      - ros2
      - launch
      - /opt/dksh/launch/l1_hardware.launch.py
      - port:=/dev/ttyUSB0
      - "start_navigation:=${L1_START_NAVIGATION:-false}"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          source /opt/ros/jazzy/setup.bash &&
          source /opt/dksh_ros2/install/setup.bash &&
          ros2 node list 2>/dev/null | grep -qx /unitree_lidar_ros2_node &&
          ros2 node list 2>/dev/null | grep -qx /l1_cloud_to_scan &&
          ros2 node list 2>/dev/null | grep -qx /l1_policy_features
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
