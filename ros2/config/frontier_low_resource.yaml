frontier_explorer:
  ros__parameters:
    use_sim_time: true

    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint

    # This laptop has 16 GB system memory shared with the integrated GPU.
    # Half-rate map processing keeps Unity, SLAM and Nav2 responsive together.
    map_processing_rate_hz: 0.5
    mrtsp_solver: greedy
    frontier_map_optimization_enabled: true
    goal_preemption_enabled: false

    # Start only after Nav2 and the Unity bridge pass their health checks.
    autostart: false
    control_service_enabled: true
    completion_event_enabled: true
    return_to_start_on_complete: false

    goal_skip_on_blocked_goal: true
    post_goal_settle_enabled: true
    post_goal_min_settle: 1.5

    # Initial conservative values for the roughly 0.46 m-wide hexapod model.
    frontier_selection_min_distance: 0.8
    frontier_candidate_min_goal_distance_m: 0.8
    frontier_visit_tolerance: 0.4
    max_linear_speed_vmax: 0.35
    max_angular_speed_wmax: 0.8
