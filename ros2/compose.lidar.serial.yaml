services:
  ros2:
    devices:
      - "${UNITREE_LIDAR_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    command:
      - ros2
      - launch
      - /opt/dksh/launch/l2_hardware.launch.py
      - initialize_type:=1
      - work_mode:=9
      - serial_port:=/dev/ttyACM0
      - baudrate:=4000000
      - "start_navigation:=${L2_START_NAVIGATION:-false}"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          source /opt/ros/jazzy/setup.bash &&
          source /opt/dksh_ros2/install/setup.bash &&
          ros2 node list 2>/dev/null | grep -qx /unitree_lidar_ros2_node &&
          ros2 node list 2>/dev/null | grep -qx /l2_cloud_to_scan &&
          ros2 node list 2>/dev/null | grep -qx /l2_policy_features
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
